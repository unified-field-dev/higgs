[workspace]
resolver = "2"
members = [
    "higgs-core",
    "higgs",
    "higgs-macros",
    "higgs-identity",
    "higgs-host",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

# Deny undocumented public items. Only crates that opt in with `[lints]\nworkspace = true`
# inherit this; unlisted workspace members are unaffected until they opt in too.
[workspace.lints.rust]
missing_docs = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
cognitive_complexity = "deny"
too_many_lines = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"

[workspace.dependencies]
thiserror = "2.0.12"
serde_json = "1.0"
tracing = "0.1"
log = "0.4.27"
async-trait = "0.1"
valence = { package = "uf-valence", version = "0.1.5", default-features = false, features = ["mem", "sqlite"] }
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde = { version = "1", features = ["derive"] }
leptos = { version = "0.8", default-features = false, features = ["nightly"] }
leptos_axum = { version = "0.8", default-features = false }
axum = { version = "0.8", default-features = false }
subtle = "2.6"
higgs-identity = { path = "higgs-identity" }
higgs-host = { path = "higgs-host", default-features = false }
higgs-core = { path = "higgs-core", default-features = false }
higgs = { path = "higgs", default-features = false }
# Kits still unpublished: use deathbreakfast pin-published-l0 until uf-dev merges
# those PRs (main still git-pins older boson/valence and breaks trait identity).
boson-coordinator = { git = "https://github.com/deathbreakfast/boson-coordinator", branch = "pin-published-l0", default-features = false }
chronon-coordinator = { git = "https://github.com/deathbreakfast/chronon-coordinator", branch = "pin-published-l0" }
chronon-core = { version = "0.1.4" }
chronon-executor = { version = "0.1.4" }
photon = { package = "uf-photon", version = "0.1.4", default-features = false }
chronon-valence-identity = { git = "https://github.com/deathbreakfast/chronon-valence-identity", branch = "pin-published-l0" }
boson-valence-identity = { git = "https://github.com/deathbreakfast/boson-valence-identity", branch = "pin-published-l0" }
photon-valence-identity = { git = "https://github.com/deathbreakfast/photon-valence-identity", branch = "pin-published-l0" }
boson-backend-mem = { version = "0.1.4" }
boson-runtime = { version = "0.1.4", default-features = false }
boson-core = { version = "0.1.4" }
boson-macros = { version = "0.1.4" }
chronon-coordinator-macros = { git = "https://github.com/deathbreakfast/chronon-coordinator-macros", branch = "pin-published-l0", default-features = false }

# Coordinators may still declare uf-dev/* @ main for identities; force one graph.
[patch."https://github.com/unified-field-dev/boson-valence-identity"]
boson-valence-identity = { git = "https://github.com/deathbreakfast/boson-valence-identity", branch = "pin-published-l0" }

[patch."https://github.com/unified-field-dev/chronon-valence-identity"]
chronon-valence-identity = { git = "https://github.com/deathbreakfast/chronon-valence-identity", branch = "pin-published-l0" }

[patch."https://github.com/unified-field-dev/chronon-coordinator"]
chronon-coordinator = { git = "https://github.com/deathbreakfast/chronon-coordinator", branch = "pin-published-l0" }
